<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head('Customer Orders')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('orders')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Customer Orders', 'Manage order lifecycle, inventory stock checks, and deliveries')}"></div>

    <main class="content-container">
        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert alert-success">
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger">
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-cart-shopping" style="color:var(--primary);"></i> Orders Directory</h2>
                <a th:href="@{/orders/new}" class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-plus"></i> Place New Order
                </a>
            </div>
            <div class="card-body">
                <!-- Status Filter Bar -->
                <form th:action="@{/orders}" method="get" class="filter-bar">
                    <select name="status" class="form-control" style="width: auto;">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == selectedStatus}"></option>
                    </select>

                    <button type="submit" class="btn btn-secondary btn-sm"><i class="fa-solid fa-filter"></i> Filter</button>
                    <a th:if="${selectedStatus != null}" th:href="@{/orders}" class="btn btn-secondary btn-sm">Reset</a>
                </form>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Customer Name</th>
                                <th>City</th>
                                <th>Order Date</th>
                                <th>Items Count</th>
                                <th>Total Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td><strong th:text="'#' + ${order.id}">#1</strong></td>
                                <td>
                                    <strong th:text="${order.customer.name}">Customer Name</strong>
                                    <div style="font-size:11px;color:var(--text-muted);" th:text="${order.customer.phone}">Phone</div>
                                </td>
                                <td th:text="${order.customer.city}">City</td>
                                <td th:text="${#temporals.format(order.orderDate, 'dd-MMM-yyyy HH:mm')}">Date</td>
                                <td><span class="badge" style="background:#f1f5f9;color:var(--text-primary);" th:text="${#lists.size(order.items)} + ' items'">0 items</span></td>
                                <td><strong th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0.00</strong></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${order.status.name() == 'PLACED'} ? 'badge-placed' : 
                                                          (${order.status.name() == 'CONFIRMED'} ? 'badge-confirmed' : 
                                                          (${order.status.name() == 'DELIVERED'} ? 'badge-delivered' : 'badge-cancelled'))"
                                          th:text="${order.status}">PLACED</span>
                                </td>
                                <td>
                                    <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-secondary btn-sm">
                                        <i class="fa-solid fa-eye"></i> View Order
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 32px;">No orders found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${totalPages > 1}" class="pagination">
                    <a th:href="@{/orders(page=${currentPage - 1}, status=${selectedStatus})}"
                       class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">Previous</a>

                    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:href="@{/orders(page=${i}, status=${selectedStatus})}"
                           class="page-item" th:classappend="${currentPage == i} ? 'active' : ''"
                           th:text="${i + 1}">1</a>
                    </th:block>

                    <a th:href="@{/orders(page=${currentPage + 1}, status=${selectedStatus})}"
                       class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">Next</a>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
