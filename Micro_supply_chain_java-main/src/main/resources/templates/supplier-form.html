<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head(${pageTitle})}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('suppliers')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar(${pageTitle}, 'Provide supplier details for sourcing inventory')}"></div>

    <main class="content-container">
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header">
                <h2><i class="fa-solid fa-boxes-packing" style="color:var(--primary);"></i> <span th:text="${pageTitle}">Supplier Form</span></h2>
                <a th:href="@{/suppliers}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to List</a>
            </div>
            <div class="card-body">
                <form th:action="${supplier.id == null} ? @{/suppliers} : @{/suppliers/update/{id}(id=${supplier.id})}"
                      th:object="${supplier}" method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label class="form-label">Supplier Enterprise Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. Apex Packaging Solutions" required />
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Contact Person</label>
                            <input type="text" th:field="*{contactPerson}" class="form-control" placeholder="e.g. Rajesh Sharma" />
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number *</label>
                            <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" placeholder="e.g. +91 98450 11223" required />
                            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="form-error"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address *</label>
                            <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="e.g. vendor@domain.com" required />
                            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></span>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">Office / Warehouse Address</label>
                            <textarea th:field="*{address}" class="form-control" rows="3" placeholder="Full postal address and landmark"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Save Supplier
                            </button>
                            <a th:href="@{/suppliers}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
