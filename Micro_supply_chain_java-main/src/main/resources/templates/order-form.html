<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head('Place New Customer Order')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('orders')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Place New Order', 'Validate stock, select products, and auto-dispatch to delivery queue')}"></div>

    <main class="content-container">
        <!-- Error Alert (e.g. Insufficient Stock) -->
        <div th:if="${errorMessage}" class="alert alert-danger">
            <div>
                <strong><i class="fa-solid fa-triangle-exclamation"></i> Order Placement Failed:</strong>
                <span th:text="${errorMessage}"></span>
            </div>
        </div>

        <div class="card" style="max-width: 950px; margin: 0 auto;">
            <div class="card-header">
                <h2><i class="fa-solid fa-cart-plus" style="color:var(--primary);"></i> New Customer Order</h2>
                <a th:href="@{/orders}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Orders</a>
            </div>
            <div class="card-body">
                <form th:action="@{/orders}" th:object="${orderRequest}" method="post" id="orderCreateForm">
                    
                    <!-- Customer Selection -->
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label class="form-label" style="font-size: 14px;">Select Purchasing Customer *</label>
                        <select th:field="*{customerId}" class="form-control" required style="font-size: 15px; font-weight: 500;">
                            <option value="">-- Choose Customer Destination --</option>
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:text="${c.name} + ' — ' + ${c.city} + ' (' + ${c.phone} + ')'">
                            </option>
                        </select>
                    </div>

                    <!-- Products Table -->
                    <div style="margin-bottom: 24px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <h3 style="font-size: 15px; font-weight: 600; color: var(--text-primary);">
                                <i class="fa-solid fa-boxes-stacked" style="color:var(--secondary);"></i> Order Line Items
                            </h3>
                            <button type="button" id="addItemBtn" class="btn btn-secondary btn-sm">
                                <i class="fa-solid fa-plus"></i> Add Item Line
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="data-table" id="orderItemsTable">
                                <thead>
                                    <tr>
                                        <th style="width: 50%;">Product Item</th>
                                        <th style="width: 20%;">Quantity</th>
                                        <th style="width: 20%;">Subtotal</th>
                                        <th style="width: 10%; text-align:center;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item, stat : *{items}">
                                        <td>
                                            <select th:field="*{items[__${stat.index}__].productId}" class="form-control product-select" required>
                                                <option value="">-- Select Product --</option>
                                                <option th:each="p : ${products}"
                                                        th:value="${p.id}"
                                                        th:data-price="${p.price}"
                                                        th:data-stock="${p.stockQuantity}"
                                                        th:text="${p.name} + ' (₹' + ${p.price} + ' | Stock: ' + ${p.stockQuantity} + ')'"
                                                        th:selected="${item.productId != null and item.productId == p.id}">
                                                </option>
                                            </select>
                                            <div class="stock-notice" style="font-size:11px;color:var(--text-muted);margin-top:4px;">
                                                Available Stock: -
                                            </div>
                                        </td>
                                        <td>
                                            <input type="number" min="1" th:field="*{items[__${stat.index}__].quantity}" class="form-control quantity-input" value="1" required />
                                        </td>
                                        <td>
                                            <span class="subtotal-cell" style="font-weight:700;font-size:14px;color:var(--text-primary);">₹0.00</span>
                                        </td>
                                        <td style="text-align:center;">
                                            <button type="button" class="btn btn-danger btn-sm remove-row-btn" title="Remove Item">
                                                <i class="fa-solid fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Order Summary Bar -->
                    <div style="background:#f8fafc;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
                        <div>
                            <span style="font-size:13px;color:var(--text-secondary);display:block;">Calculated Order Total</span>
                            <strong style="font-size:24px;color:var(--primary);" id="grandTotalDisplay">₹0.00</strong>
                        </div>
                        <div style="font-size:12px;color:var(--text-muted);text-align:right;">
                            <i class="fa-solid fa-shield-halved"></i> Transactional Stock Check & Auto-Delivery Scheduling
                        </div>
                    </div>

                    <!-- Form Actions -->
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" style="padding: 12px 24px; font-size: 15px;">
                            <i class="fa-solid fa-check"></i> Place & Confirm Order
                        </button>
                        <a th:href="@{/orders}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
