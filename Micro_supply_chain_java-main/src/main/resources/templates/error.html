<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head('Error Notice')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Application Notice', 'Request processing status')}"></div>

    <main class="content-container">
        <div class="card" style="max-width: 650px; margin: 40px auto; text-align: center;">
            <div class="card-body" style="padding: 48px 32px;">
                <div style="width: 72px; height: 72px; background: var(--danger-light); color: var(--danger); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px auto;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h2 style="font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">
                    <span th:text="${errorCode} != null ? 'Error ' + ${errorCode} : 'Notice'">Error</span>
                </h2>

                <p style="font-size: 15px; color: var(--text-secondary); margin-bottom: 24px;" 
                   th:text="${errorMessage} != null ? ${errorMessage} : 'An unexpected condition occurred while processing your request.'">
                    Error description
                </p>

                <div style="display: flex; justify-content: center; gap: 12px;">
                    <a th:href="@{/dashboard}" class="btn btn-primary">
                        <i class="fa-solid fa-house"></i> Return to Dashboard
                    </a>
                    <button onclick="window.history.back()" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-left"></i> Go Back
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
