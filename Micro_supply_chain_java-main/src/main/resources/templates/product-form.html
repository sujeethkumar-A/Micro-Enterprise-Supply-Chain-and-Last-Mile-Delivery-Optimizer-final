<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: page-head(${pageTitle})}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('products')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar(${pageTitle}, 'Configure catalog specifications and inventory safety stock')}"></div>

    <main class="content-container">
        <div class="card" style="max-width: 850px; margin: 0 auto;">
            <div class="card-header">
                <h2><i class="fa-solid fa-boxes-stacked" style="color:var(--primary);"></i> <span th:text="${pageTitle}">Product Form</span></h2>
                <a th:href="@{/products}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Inventory</a>
            </div>
            <div class="card-body">
                <form th:action="${product.id == null} ? @{/products} : @{/products/update/{id}(id=${product.id})}"
                      th:object="${product}" method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label class="form-label">Product Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g. Corrugated Shipping Box (Large)" required />
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Category *</label>
                            <input type="text" th:field="*{category}" class="form-control" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''" placeholder="e.g. Packaging, Electronics, Raw Materials" required />
                            <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="form-error"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Unit Price (₹) *</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" placeholder="0.00" required />
                            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="form-error"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Current Stock Quantity *</label>
                            <input type="number" th:field="*{stockQuantity}" class="form-control" th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''" placeholder="0" required />
                            <span th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}" class="form-error"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Minimum Stock Alert Threshold *</label>
                            <input type="number" th:field="*{minimumStock}" class="form-control" th:classappend="${#fields.hasErrors('minimumStock')} ? 'is-invalid' : ''" placeholder="e.g. 10 (Triggers Low-Stock warning)" required />
                            <span th:if="${#fields.hasErrors('minimumStock')}" th:errors="*{minimumStock}" class="form-error"></span>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">Primary Supplier *</label>
                            <select name="supplierId" class="form-control" required>
                                <option value="">-- Select Sourcing Vendor --</option>
                                <option th:each="s : ${suppliers}"
                                        th:value="${s.id}"
                                        th:text="${s.name} + ' (' + ${s.contactPerson} + ' - ' + ${s.phone} + ')'"
                                        th:selected="${product.supplier != null and product.supplier.id == s.id}">
                                </option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">Product Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Specifications, dimensions, or internal notes"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> Save Product
                            </button>
                            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
