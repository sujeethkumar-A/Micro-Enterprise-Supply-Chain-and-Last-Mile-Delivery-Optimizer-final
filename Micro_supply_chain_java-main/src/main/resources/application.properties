# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=micro-enterprise-supply-chain

# Local Development MySQL Connection (micro_supply_chain database)
spring.datasource.url=jdbc:mysql://localhost:3306/git micro_supply_chain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sujeeth940
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Template Cache (disable for smooth development)
spring.thymeleaf.cache=false

# Supply Chain & Delivery Configuration
app.delivery.base-cost=30.0
app.delivery.cost-per-km=8.0
app.delivery.speed-kmh=30.0

# Central Enterprise Depot Location (Starting point for Last-Mile Route Optimization)
# Default: Central Enterprise Depot (Bangalore CBD)
app.warehouse.name=Central Depot & Micro-Enterprise Hub
app.warehouse.latitude=12.9716
app.warehouse.longitude=77.5946
